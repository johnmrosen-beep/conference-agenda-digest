# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".
# No API key or secret is used here; the deployed site contains no key.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
